- name: reviews
  label: 'Commercial: reviews'
  label_singular: Review
  folder: src/content/reviews
  create: true
  delete: true
  extension: json
  format: json
  identifier_field: author
  slug: '{{slug}}'
  summary: '{{author}}'
  sortable_fields:
  - order
  - author
  editor:
    preview: false
  description: Client reviews. Most appear on the services page; each service page shows up to three that are tagged for it.
  fields:
  - name: quote
    label: Review text
    widget: text
    hint: Exactly as the client wrote it.
  - name: author
    label: Name
    widget: string
  - name: lang
    label: Language of the review
    widget: select
    options:
    - label: Czech
      value: cs
    - label: English
      value: en
    default: cs
  - name: on_hub
    label: Show on the services page
    widget: boolean
    default: true
  - name: services
    label: Also show on these service pages (up to 3 per page)
    widget: select
    multiple: true
    required: false
    options:
    - label: Conferences and corporate events
      value: konference
    - label: Celebrations and parties
      value: oslavy
    - label: Brands and products
      value: znacky
    - label: Interiors
      value: interiery
    - label: Portraits for professionals
      value: portrety
  - name: order
    label: Position
    widget: number
    value_type: int
    default: 100
