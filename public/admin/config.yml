# Sveltia CMS configuration (Decap-compatible)
# Login: GitHub via Netlify's built-in OAuth provider
# Uploads are committed to public/images; content stores the /images/... path
backend:
  name: github
  repo: vigor1456/zavatsky-site
  branch: main
media_folder: public/images
public_folder: /images
site_url: https://zavatsky.photo
display_url: https://zavatsky.photo
collections:
- name: journal
  label: Journal
  label_singular: Post
  description: Blog posts. English only. New posts publish automatically after a short build.
  folder: src/content/journal
  create: true
  delete: true
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  preview_path: blog/{{slug}}
  fields:
  - name: title
    label: Title
    widget: string
  - name: date
    label: Date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - name: author
    label: Author voice
    widget: select
    options:
    - VZ
    - MR
    default: VZ
    hint: VZ = Vadim Zavatsky, MR = Maximilian Ravique
  - name: category
    label: Category
    widget: string
    default: Journal
  - name: cover
    label: Cover image (listing)
    widget: image
  - name: hero
    label: Hero image (top of post)
    widget: image
    required: false
  - name: excerpt
    label: Excerpt
    widget: text
    required: false
  - name: draft
    label: Draft (hide from site)
    widget: boolean
    default: false
  - name: body
    label: Body
    widget: markdown
- name: galleries
  label: Galleries
  description: Add, remove, reorder and describe the photos in each gallery, and edit its title and intro in both languages.
  editor:
    preview: false
  files:
  - name: portrait
    label: Portraits (Vadim Zavatsky)
    file: src/content/galleries/portrait.json
    fields:
    - name: title
      label: Title (English)
      widget: string
    - name: title_cs
      label: Title (Czech)
      widget: string
      required: false
    - name: side
      label: Side
      widget: hidden
    - name: intro
      label: Intro (English)
      widget: text
      hint: Shown under the title, and used as the description in Google.
    - name: intro_cs
      label: Intro (Czech)
      widget: text
      required: false
    - name: splitAfter
      label: 'Top block: number of photos'
      widget: number
      required: false
      value_type: int
      hint: How many photos sit in the upper block before the break. Leave as-is unless rebalancing.
    - name: images
      label: Photos
      label_singular: Photo
      widget: list
      summary: '{{fields.alt}}'
      fields:
      - name: src
        label: Photo
        widget: image
        hint: sRGB, 2048 px on the long side, about 85% JPEG quality.
      - name: alt
        label: Description (for screen readers and Google)
        widget: string
        required: false
        default: ''
        hint: One short sentence saying what is in the photo.
  - name: editorial
    label: Editorial (Vadim Zavatsky)
