- name: series
  label: Series
  label_singular: Series
  description: Personal series on the People side. Each one gets its own page and a card on the People page, ordered by Position.
  folder: src/content/series
  create: true
  delete: true
  extension: json
  format: json
  identifier_field: title
  slug: '{{slug}}'
  summary: '{{order}}: {{title}}'
  sortable_fields:
  - order
  - title
  editor:
    preview: false
  fields:
  - name: title
    label: Title (English)
    widget: string
    hint: Also sets the page address, e.g. 'Night Swim' becomes /night-swim.
  - name: title_cs
    label: Title (Czech)
    widget: string
    required: false
  - name: order
    label: Position
    widget: number
    value_type: int
    default: 100
    hint: 'Lower numbers come first on the People page. Existing: Good Wife 10, Untold 20, Under the Film 30. Use 15 to sit between the first two.'
  - name: date
    label: Year made
    widget: datetime
    required: false
    date_format: YYYY
    time_format: false
    format: YYYY-MM-DD
    hint: Optional. Shown under the intro.
  - name: cover
    label: Cover photo (People page card)
    widget: image
    hint: Wide covers take the wide slots, upright covers the narrow one.
  - name: cover_alt
    label: Cover description
    widget: string
    required: false
  - name: card
    label: Card line (English)
    widget: string
    required: false
    hint: One short line under the title on the People page.
  - name: card_cs
    label: Card line (Czech)
    widget: string
    required: false
  - name: intro
    label: Intro (English)
    widget: text
    hint: Shown at the top of the series page, and used as the description in Google.
  - name: intro_cs
    label: Intro (Czech)
    widget: text
    required: false
  - name: texts
    label: Text blocks between photos
    label_singular: Text block
    widget: list
    required: false
    summary: 'after photo {{fields.after}}, {{fields.align}}: {{fields.text}}'
    hint: Short texts placed between the photos. Blocks set after the same photo appear together, as one pause.
    fields:
    - name: text
      label: Text (English)
      widget: text
    - name: text_cs
      label: Text (Czech)
      widget: text
      required: false
    - name: after
      label: Appears after photo number
      widget: number
      value_type: int
      required: false
      hint: 'e.g. 5 = after the fifth photo. Empty: the middle of the series.'
    - name: align
      label: Alignment
      widget: select
      options:
      - label: Left
        value: left
      - label: Centre
        value: center
      - label: Right
        value: right
      default: left
  - name: credits
    label: Credits
    label_singular: Credit
    widget: list
    required: false
    hint: Optional. Add only the people you want credited; leave empty for none. Nothing is shown when empty.
    summary: '{{fields.role}}: {{fields.name}}'
    fields:
    - name: role
      label: Role (English)
      widget: string
      required: false
      hint: e.g. Model, Styling, Make-up
    - name: role_cs
      label: Role (Czech)
      widget: string
      required: false
    - name: name
      label: Name
      widget: string
    - name: url
      label: Link (optional)
      widget: string
      required: false
      hint: Instagram or website, starting with https://
  - name: images
    label: Photos
    label_singular: Photo
    widget: list
    summary: '{{fields.alt}}'
    fields:
    - name: src
      label: Photo
      widget: image
      hint: sRGB, 2048 px on the long side, about 85% JPEG quality.
    - name: alt
      label: Description (for screen readers and Google)
      widget: string
      required: false
      default: ''
      hint: One short sentence saying what is in the photo.
    - name: layout
      label: Layout
      widget: select
      default: auto
      required: false
      hint: Automatic picks a layout from the photo’s shape and position. Pair joins this photo with the next one.
      options:
      - label: Automatic
        value: auto
      - label: Full width
        value: full
      - label: Framed (centred)
        value: framed
      - label: Left
        value: left
      - label: Right
        value: right
      - label: Pair with next photo
        value: pair
    hint: The photos in order. The page lays them out as a photo essay; each photo can override its layout.
- name: prints
  label: Prints
  label_singular: Print
  description: Prints offered on the Prints page. Formats, sizes and prices are set once in Print price list.
  folder: src/content/prints
  create: true
  delete: true
  extension: json
  format: json
  identifier_field: title
  slug: '{{slug}}'
  summary: '{{order}}: {{title}}'
  sortable_fields:
  - order
  - title
  editor:
    preview: false
  fields:
  - name: title
    label: Title (English)
    widget: string
  - name: title_cs
    label: Title (Czech)
    widget: string
    required: false
  - name: order
    label: Position
    widget: number
    value_type: int
    default: 100
    hint: 'Lower numbers come first. Existing: Lamps in the Fog 10, Above the Clouds 20.'
  - name: available
    label: Show on the Prints page
    widget: boolean
    default: true
    hint: Switch off to hide a print without deleting it.
  - name: place
    label: Place (English)
    widget: string
    required: false
  - name: place_cs
    label: Place (Czech)
    widget: string
    required: false
  - name: year
    label: Year
    widget: number
    value_type: int
    required: false
  - name: story
    label: Short story (English)
    widget: text
    hint: Two or three sentences about the photograph.
  - name: story_cs
    label: Short story (Czech)
    widget: text
    required: false
  - name: orientation
    label: Orientation
    widget: select
    options:
    - landscape
    - portrait
    - square
    default: landscape
  - name: formats
    label: Available formats
    widget: select
    multiple: true
    options:
    - label: Fine art print
      value: print
    - label: Framed print
      value: framed
    - label: Canvas
      value: canvas
    default:
    - print
    - framed
    - canvas
  - name: etsy
    label: Etsy listing for the digital file (optional)
    widget: string
    required: false
    hint: Paste this photo's Etsy listing link. Without one, the 'digital file' link goes to the Etsy shop.
  - name: mockups
    label: Mockups
    label_singular: Mockup
    widget: list
    min: 1
    hint: The first one is shown large; the others become thumbnails visitors can switch to. Square images work best.
    summary: '{{fields.alt}}'
    fields:
    - name: src
      label: Image
      widget: image
    - name: alt
      label: Description (for screen readers and Google)
      widget: string
      required: false
      default: ''
- name: printshop
  label: Print price list
  description: Formats, sizes and prices shared by all prints, plus the texts on the Prints page.
  editor:
    preview: false
  files:
  - name: settings
    label: Prices and texts
    file: src/content/printshop/settings.json
    fields:
    - name: intro
      label: Intro (English)
      widget: text
    - name: intro_cs
      label: Intro (Czech)
      widget: text
      required: false
    - name: shipping
      label: Made to order text (English)
      widget: text
    - name: shipping_cs
      label: Made to order text (Czech)
      widget: text
      required: false
    - name: checkout_enabled
      label: Online checkout (Buy buttons)
      widget: boolean
      default: false
      hint: 'On: visitors can buy with Stripe. Off: prints can only be enquired about by email.'
    - name: etsy_url
      label: Etsy shop link (optional)
      widget: string
      required: false
      hint: Your Etsy shop. Used for the digital-file links when a print has no listing of its own.
    - name: shipping_zones
      label: Shipping rates
      label_singular: Destination
      widget: list
      summary: '{{fields.zone}}: tube {{fields.tube}}, box {{fields.box}}'
      hint: 'Rates in EUR per order. Tube: unframed prints, rolled. Box: framed prints and canvases. Leave a rate empty until you know it; the table appears on the Prints page once rates are filled in.'
      fields:
      - name: zone
        label: Destination (English)
        widget: string
      - name: zone_cs
        label: Destination (Czech)
        widget: string
        required: false
      - name: countries
        label: Countries in this zone
        widget: select
        multiple: true
        options:
        - label: Austria
          value: AT
        - label: Belgium
          value: BE
        - label: Bulgaria
          value: BG
        - label: Croatia
          value: HR
        - label: Cyprus
          value: CY
        - label: Czechia
          value: CZ
        - label: Denmark
          value: DK
        - label: Estonia
          value: EE
        - label: Finland
          value: FI
        - label: France
          value: FR
        - label: Germany
          value: DE
        - label: Greece
          value: GR
        - label: Hungary
          value: HU
        - label: Ireland
          value: IE
        - label: Italy
          value: IT
        - label: Latvia
          value: LV
        - label: Lithuania
          value: LT
        - label: Luxembourg
          value: LU
        - label: Malta
          value: MT
        - label: Netherlands
          value: NL
        - label: Poland
          value: PL
        - label: Portugal
          value: PT
        - label: Romania
          value: RO
        - label: Slovakia
          value: SK
        - label: Slovenia
          value: SI
        - label: Spain
          value: ES
        - label: Sweden
          value: SE
        hint: Each EU country should be in exactly one zone.
      - name: tube
        label: Tube (unframed), EUR
        widget: number
        value_type: float
        required: false
      - name: box
        label: Box (framed, canvas), EUR
        widget: number
        value_type: float
        required: false
    - name: formats
      label: Formats
      label_singular: Format
      widget: list
      allow_add: false
      summary: '{{fields.name}}'
      fields:
      - name: id
        label: ID (do not change)
        widget: hidden
      - name: name
        label: Name (English)
        widget: string
      - name: name_cs
        label: Name (Czech)
        widget: string
        required: false
      - name: note
        label: Note (English)
        widget: string
        required: false
      - name: note_cs
        label: Note (Czech)
        widget: string
        required: false
      - name: parcel
        label: Ships in
        widget: select
        options:
        - label: Tube (rolled)
          value: tube
        - label: Box
          value: box
        default: box
      - name: sizes
        label: Sizes and prices
        label_singular: Size
        widget: list
        summary: '{{fields.size}}: {{fields.price}}'
        fields:
        - name: size
          label: Size
          widget: string
          hint: e.g. 50 × 70 cm
        - name: price
          label: Price in EUR
          widget: number
          value_type: float
          required: false
          hint: Leave empty to show 'Price on request'.
        - name: code
          label: Lab product code (optional)
          widget: string
          required: false
          hint: For your own reference, e.g. the lab's name for this product.
- name: services
  label: 'Commercial: services'
  label_singular: Service
  folder: src/content/services
  create: true
  delete: false
  extension: json
  format: json
  identifier_field: slug_cs
  slug: '{{fields.slug_cs}}'
  summary: '{{order}}: {{fields.title.cs}}'
  sortable_fields:
  - order
  editor:
    preview: false
  description: The five commercial services. Each has a Czech page (/sluzby/…) and an English page (/en/services/…).
  fields:
  - name: order
    label: Position
    widget: number
    value_type: int
    default: 100
    hint: Order on the services page (lower first).
  - name: slug_cs
    label: Czech address
    widget: string
    hint: Last part of the Czech address, e.g. konference. Changing it changes the page address.
  - name: slug_en
    label: English address
    widget: string
    hint: Last part of the English address, e.g. conferences.
  - name: title
    label: Service name
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
  - name: h1
    label: Page headline
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
  - name: tagline
    label: Large headline line (optional)
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
    required: false
    hint: If filled in, this becomes the big headline and the page headline above it turns into a smaller line, e.g. "Fotky z vaší akce ještě týž den."
  - name: card
    label: Card line (services page)
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
  - name: intro
    label: Intro
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: text
    - name: en
      label: English
      widget: text
  - name: seo_title
    label: Title in Google
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
  - name: seo_description
    label: Description in Google
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: text
    - name: en
      label: English
      widget: text
  - name: price_czk
    label: Starting price in CZK
    widget: number
    value_type: int
    required: false
  - name: price_eur
    label: Starting price in EUR
    widget: number
    value_type: int
    required: false
  - name: price_unit
    label: Price unit (optional)
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
    required: false
    hint: Shown after the price, e.g. "za osobu" / "per person".
  - name: offer_title
    label: Label above the price (optional)
    widget: object
    collapsed: false
    fields:
    - name: cs
      label: Czech
      widget: string
    - name: en
      label: English
      widget: string
    required: false
    hint: e.g. "Pro značky" / "For brands". Useful when the page has two offers.
  - name: example_label
    label: Price example label
    widget: object
